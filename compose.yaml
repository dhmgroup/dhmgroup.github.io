# Local development only. Production services are provisioned in Coolify.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: dhm
      POSTGRES_PASSWORD: dhm
      POSTGRES_DB: dhm
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dhm"]
      interval: 2s
      retries: 20

  mail:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # web UI: http://localhost:8025
  s3:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: dhm
      MINIO_ROOT_PASSWORD: dhm-minio-secret
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # console: http://localhost:9001
    volumes:
      - s3data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      retries: 20
  s3-init:
    image: minio/minio:latest   # bundles the mc client
    depends_on:
      s3:
        condition: service_healthy
    entrypoint: >
      sh -c "mc alias set local http://s3:9000 dhm dhm-minio-secret &&
             mc mb -p local/dhm-assets local/dhm-test &&
             mc anonymous set download local/dhm-assets &&
             mc anonymous set download local/dhm-test"

volumes:
  pgdata:
  s3data:
