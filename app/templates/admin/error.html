{% extends "base.html" %}
{% block title %}{{ heading }} | DHM admin{% endblock %}
{% block meta %}<meta name="robots" content="noindex">{% endblock %}
{% block body_class %}grid min-h-dvh place-items-center px-4{% endblock %}
{% block body %}
  <main class="flex max-w-md flex-col items-start gap-4">
    <i class="ph {{ icon }} text-3xl text-muted" aria-hidden="true"></i>
    <h1 class="text-2xl font-semibold tracking-tight">{{ heading }}</h1>
    <p class="text-sm text-muted">{{ body }}</p>
    <a href="{{ back }}" class="btn btn-primary text-sm">Back to the admin</a>
  </main>
{% endblock %}
